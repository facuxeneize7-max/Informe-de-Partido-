<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga de Fútbol Mercedes - Informe del Partido</title>
  
  <!-- ICONO PARA PANTALLA DE INICIO EN IPHONE / IOS -->
  <link rel="apple-touch-icon" href="IMG_2073.jpeg">
  <link rel="shortcut icon" href="IMG_2073.jpeg" type="image/x-icon">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @page {
      size: A4 portrait;
      margin: 6mm;
    }
    @media print {
      body { background: white !important; padding: 0 !important; margin: 0 !important; }
      .no-print { display: none !important; }
      .print-container { 
        box-shadow: none !important; 
        border: none !important; 
        padding: 0 !important; 
        margin: 0 !important; 
        width: 100% !important; 
        max-width: 100% !important;
      }
      input, textarea { border: none !important; background: transparent !important; resize: none !important; }
    }
    .sheet-border { border: 2px solid #111827; }
    .sheet-grid { border-collapse: collapse; width: 100%; }
    .sheet-grid td, .sheet-grid th { border: 1.5px solid #111827; padding: 2px 4px; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-900 pb-6">

  <!-- BARRA DE HERRAMIENTAS -->
  <header class="no-print bg-red-800 text-white p-3 sticky top-0 z-50 shadow-md">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-clipboard-list text-lg"></i>
        <span class="font-bold text-base">Liga VM - Planilla A4</span>
      </div>
      <div class="flex items-center space-x-2 text-xs">
        <button onclick="limpiarFormulario()" class="bg-red-900 text-white px-3 py-1.5 rounded border border-red-700 flex items-center gap-1">
          <i class="fa-solid fa-trash-can"></i> Limpiar
        </button>
        <button onclick="window.print()" class="bg-green-600 text-white px-4 py-1.5 rounded font-bold flex items-center gap-1 shadow">
          <i class="fa-solid fa-file-pdf"></i> Imprimir / PDF
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto my-3 px-2">
    <div class="print-container bg-white p-4 rounded-lg shadow-lg sheet-border">
      
      <!-- ENCABEZADO A4 COMPACTO -->
      <div class="flex justify-between items-center mb-2">
        <!-- ESCUDO LIGA MERCEDES -->
        <div class="w-16 h-16 flex items-center justify-center">
          <img src="IMG_2073.jpeg" alt="Liga Mercedes" class="max-h-full max-w-full object-contain">
        </div>

        <!-- TÍTULO -->
        <div class="text-center">
          <h1 class="text-lg font-black text-black tracking-wider border-b-2 border-black pb-0.5 uppercase">
            INFORME DEL PARTIDO
          </h1>
        </div>

        <!-- ESCUDO AFA -->
        <div class="w-16 h-16 flex items-center justify-center">
          <img src="https://svgshare.com/i/185g.svg" onerror="this.onerror=null; this.src='IMG_2072.webp';" alt="AFA Logo" class="max-h-full max-w-full object-contain">
        </div>
      </div>

      <!-- EQUIPOS LOCAL VS VISITANTE -->
      <div class="grid grid-cols-12 gap-2 items-center mb-2">
        <div class="col-span-5">
          <input type="text" placeholder="EQUIPO LOCAL" class="w-full border-2 border-black p-1 text-center font-extrabold text-sm uppercase rounded">
        </div>
        <div class="col-span-2 text-center">
          <span class="text-base font-black text-black">VS</span>
        </div>
        <div class="col-span-5">
          <input type="text" placeholder="EQUIPO VISITANTE" class="w-full border-2 border-black p-1 text-center font-extrabold text-sm uppercase rounded">
        </div>
      </div>

      <!-- RESULTADO FINAL -->
      <div class="mb-3 flex items-center border-2 border-black p-1 rounded bg-gray-50">
        <label class="font-bold text-xs text-black whitespace-nowrap mr-2">Resultado final:</label>
        <input type="text" placeholder="Ej: 2 - 1" class="w-full font-bold text-xs text-black bg-transparent focus:outline-none">
      </div>

      <!-- 1. GOLES (ARRIBA DE TODO - 8 RENGLONES CON FORMATO AUTOMÁTICO) -->
      <div class="mb-2">
        <h2 class="text-center font-extrabold text-black text-xs border-t-2 border-x-2 border-black bg-gray-200 py-0.5 uppercase">Goles</h2>
        <table class="sheet-grid">
          <thead><tr class="bg-gray-100 text-[10px] font-bold"><th class="w-1/2">LOCAL</th><th class="w-1/2">VISITANTE</th></tr></thead>
          <tbody>
            <tr>
              <td><textarea rows="8" onkeydown="handleAutoPrefix(event, 'numero')" oninput="autoExpand(this)" placeholder="Escriba para formatear..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
              <td><textarea rows="8" onkeydown="handleAutoPrefix(event, 'numero')" oninput="autoExpand(this)" placeholder="Escriba para formatear..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 2. AMONESTADOS (8 RENGLONES CON FORMATO AUTOMÁTICO) -->
      <div class="mb-2">
        <h2 class="text-center font-extrabold text-black text-xs border-t-2 border-x-2 border-black bg-gray-200 py-0.5 uppercase">Amonestados</h2>
        <table class="sheet-grid">
          <thead><tr class="bg-gray-100 text-[10px] font-bold"><th class="w-1/2">LOCAL</th><th class="w-1/2">VISITANTE</th></tr></thead>
          <tbody>
            <tr>
              <td><textarea rows="8" onkeydown="handleAutoPrefix(event, 'numero')" oninput="autoExpand(this)" placeholder="Escriba para formatear..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
              <td><textarea rows="8" onkeydown="handleAutoPrefix(event, 'numero')" oninput="autoExpand(this)" placeholder="Escriba para formatear..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 3. EXPULSADOS (8 RENGLONES CON FORMATO AUTOMÁTICO) -->
      <div class="mb-2">
        <h2 class="text-center font-extrabold text-black text-xs border-t-2 border-x-2 border-black bg-gray-200 py-0.5 uppercase">Expulsados</h2>
        <table class="sheet-grid">
          <thead><tr class="bg-gray-100 text-[10px] font-bold"><th class="w-1/2">LOCAL</th><th class="w-1/2">VISITANTE</th></tr></thead>
          <tbody>
            <tr>
              <td><textarea rows="8" onkeydown="handleAutoPrefix(event, 'numero')" oninput="autoExpand(this)" placeholder="Escriba para formatear..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
              <td><textarea rows="8" onkeydown="handleAutoPrefix(event, 'numero')" oninput="autoExpand(this)" placeholder="Escriba para formatear..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 4. CAMBIOS REALIZADOS (6 RENGLONES CON FORMATO CAMBIO AUTOMÁTICO) -->
      <div class="mb-3">
        <h2 class="text-center font-extrabold text-black text-xs border-t-2 border-x-2 border-black bg-gray-200 py-0.5 uppercase">Cambios Realizados</h2>
        <table class="sheet-grid">
          <thead><tr class="bg-gray-100 text-[10px] font-bold"><th class="w-1/2">LOCAL</th><th class="w-1/2">VISITANTE</th></tr></thead>
          <tbody>
            <tr>
              <td><textarea rows="6" onkeydown="handleAutoPrefix(event, 'cambio')" oninput="autoExpand(this)" placeholder="Presione para agregar cambio..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
              <td><textarea rows="6" onkeydown="handleAutoPrefix(event, 'cambio')" oninput="autoExpand(this)" placeholder="Presione para agregar cambio..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 5. INCIDENCIAS (12 RENGLONES) -->
      <div class="mb-3 border-2 border-black p-1.5 rounded">
        <label class="block font-extrabold text-black text-xs mb-0.5 uppercase">Incidencias:</label>
        <textarea rows="12" oninput="autoExpand(this)" placeholder="Observaciones..." class="w-full text-xs p-0.5 border-none focus:outline-none resize-none overflow-hidden"></textarea>
      </div>

      <!-- TERNA ARBITRAL -->
      <div class="space-y-1.5 pt-1 text-xs">
        <div class="flex items-center">
          <span class="font-extrabold text-black w-24 uppercase">Árbitro:</span>
          <input type="text" class="flex-grow border-b-2 border-black pb-0.5 focus:outline-none">
        </div>
        <div class="flex items-center">
          <span class="font-extrabold text-black w-24 uppercase">Asistente 1:</span>
          <input type="text" class="flex-grow border-b-2 border-black pb-0.5 focus:outline-none">
        </div>
        <div class="flex items-center">
          <span class="font-extrabold text-black w-24 uppercase">Asistente 2:</span>
          <input type="text" class="flex-grow border-b-2 border-black pb-0.5 focus:outline-none">
        </div>
      </div>

    </div>
  </main>

  <script>
    function autoExpand(field) {
      field.style.height = 'auto';
      field.style.height = field.scrollHeight + 'px';
    }

    function handleAutoPrefix(event, type) {
      const el = event.target;
      const prefix = type === 'numero' ? 'N° ' : 'Sale N°  - Entra N°  ( \' )';
      
      // Si la celda está vacía al presionar cualquier tecla (salvo teclas de control)
      if (el.value === '' && event.key.length === 1) {
        event.preventDefault();
        el.value = prefix + (type === 'numero' ? event.key : '');
        autoExpand(el);
        return;
      }

      // Si se presiona la tecla Enter
      if (event.key === 'Enter') {
        event.preventDefault();
        const start = el.selectionStart;
        const end = el.selectionEnd;
        const textBefore = el.value.substring(0, start);
        const textAfter = el.value.substring(end);
        
        el.value = textBefore + '\n' + prefix + textAfter;
        el.selectionStart = el.selectionEnd = start + 1 + prefix.length;
        autoExpand(el);
      }
    }

    function limpiarFormulario() {
      if (confirm('¿Limpiar planilla?')) {
        document.querySelectorAll('input, textarea').forEach(el => {
          el.value = '';
          if (el.tagName.toLowerCase() === 'textarea') {
            el.style.height = 'auto';
          }
        });
      }
    }
  </script>
</body>
</html>
